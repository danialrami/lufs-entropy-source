[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lufs-seed"
version = "0.1.0"
description = "Verifiable, provenanced seeds for process work"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Daniel Ramirez", email = "daniel@lufs.audio"}]
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=41"]
dev = ["pytest>=7", "cryptography>=41"]

[project.scripts]
lufs-seed = "lufs_seed.cli:main"

[tool.setuptools.packages.find]
include = ["lufs_seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
